[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodecode-fea"
version = "0.1.0"
description = "Node-based visual scripting for Abaqus: post-processing, modelling and a live link to Abaqus/CAE"
license = {text = "Apache-2.0"}
authors = [{name = "Mahy Soler"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
nodecode-fea = "nodecode_fea.app:main"

[tool.setuptools.packages.find]
include = ["nodecode_fea*"]

[tool.setuptools.package-data]
nodecode_fea = ["worker/*.py", "cae_link_files/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
